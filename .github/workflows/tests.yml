name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    # Installer, scripts, contracts and Word delivery; the R-backed tests skip when R is absent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/edu-writing/requirements.txt
      - run: python -X utf8 -m unittest discover tests -v

  r:
    # Known-answer checks of the analysis helpers and the R-backed module tests.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages (binary builds from the public package manager)
        run: Rscript -e 'install.packages(c("jsonlite","psych","GPArotation","lavaan","semTools","seminr","QCA","NCA","lme4","lmerTest","afex","emmeans"))'
      - run: Rscript skills/edu-analysis/tests/known_answers.R
      - run: python -m pip install -r skills/edu-writing/requirements.txt
      - run: python -X utf8 -m unittest tests.test_modules -v
